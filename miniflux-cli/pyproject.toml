[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "miniflux-cli"
version = "0.1.0"
description = "CLI for reading Miniflux entries as Markdown and fetching enclosures"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
miniflux-cli = "miniflux_cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["miniflux_cli"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
strict = true
