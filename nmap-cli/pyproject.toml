[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nmap-cli"
version = "0.1.0"
description = "CLI tool for NAVER Cloud Maps APIs"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
nmap-cli = "nmap_cli:main"

[tool.hatch.build.targets.wheel]
only-include = ["nmap_cli.py", "py.typed"]
