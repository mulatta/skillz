[tool.ruff]
line-length = 88
target-version = "py312"

lint.select = ["ALL"]
lint.ignore = [
  # pydocstyle
  "D",
  # todo comments
  "TD",
  # fixmes
  "FIX",
  # Unused function argument
  "ARG001",
  # Trailing comma missing
  "COM812",
  # Found commented-out code
  "ERA001",
  # Boolean-typed positional argument in function definition
  "FBT001",
  # Logging statement uses f-string
  "G004",
  # disabled on ruff's recommendation as causes problems with the formatter
  "ISC001",
  # Use of `assert` detected
  "S101",
  # `subprocess` call: check for execution of untrusted input
  "S603",
  # Starting a process with a partial executable path
  "S607",
  # Boolean default positional argument in function definition
  "FBT002",
  "E501",    # line too long
  "T201",    # `print` found
  "PLR2004", # Magic value used in comparison
  "B905",    # zip without strict
  "C901",    # complex functions
  "EM101",   # string literal in exception
  "EM102",   # f-string in exception
  "EXE001",  # shebang on non-executable checked source
  "PLR0911", # Too many return statements
  "PLR0913", # Too many arguments
  "PLR0915", # Too many statements
  "PYI041",  # int | float annotation
  "RUF007",  # Prefer pairwise
  "RUF100",  # Unused noqa from package-local lint baselines
  "TC001",   # Move application imports into TYPE_CHECKING
  "TC002",   # Move third-party imports into TYPE_CHECKING
  "TC003",   # Move standard-library imports into TYPE_CHECKING
  "TRY003",  # Long exception messages
  "UP022",   # Prefer capture_output
]

[tool.ruff.lint.per-file-ignores]
"*/tests/*.py" = [
  "ARG002",
  "INP001",
]

[tool.mypy]
python_version = "3.12"
warn_redundant_casts = true
strict = true
disallow_untyped_calls = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "setuptools.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pytest.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["patchright.*", "pyvirtualdisplay.*", "markdownify.*"]
ignore_missing_imports = true
implicit_reexport = true
