[project]
name = "drawio-cli"
version = "0.1.0"
description = "Offline draw.io authoring helper CLI"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = ["defusedxml"]

[project.scripts]
drawio-cli = "drawio_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drawio_cli"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
ignore = ["TRY004", "EXE001", "UP022"]

[tool.mypy]
python_version = "3.13"
strict = true
