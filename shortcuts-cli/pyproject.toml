[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shortcuts-cli"
version = "0.1.0"
description = "Agent-friendly wrapper for Cherri and macOS Shortcuts"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
shortcuts-cli = "shortcuts_cli:main"

[tool.hatch.build.targets.wheel]
only-include = ["shortcuts_cli.py", "py.typed"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "D",
  "E501",
  "ERA001",
  "FBT001",
  "FBT002",
  "FIX",
  "G004",
  "INP001",
  "ISC001",
  "PLR2004",
  "S101",
  "S603",
  "S607",
  "T201",
  "TD",
  "ARG001",
]
