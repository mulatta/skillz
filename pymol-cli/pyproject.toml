[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pymol-cli"
version = "0.1.0"
description = "Agent-oriented CLI for controlling PyMOL XML-RPC sessions"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
pymol-cli = "pymol_cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["pymol_cli"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
